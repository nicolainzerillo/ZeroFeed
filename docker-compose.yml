services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zerofeed-relay
    restart: unless-stopped
    ports:
      - "8443:8443/tcp"
      - "8443:8443/udp"
      - "8444:8444/tcp"
      - "9090:9090/tcp"
    environment:
      - ZEROFEED_RELAY=0.0.0.0:8443
    command:
      - "--port"
      - "8443"
      - "--quic"
      - "--ws-port"
      - "8444"
      - "--metrics-addr"
      - "0.0.0.0:9090"
      - "--log-format"
      - "json"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 32M
